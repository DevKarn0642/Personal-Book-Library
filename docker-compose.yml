services:
  db:
    image: postgres:16-alpine
    container_name: book-library-db
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: book_library
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: