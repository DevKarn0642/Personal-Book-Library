services:
  db:
    image: postgres:16-alpine
    container_name: book-library-db
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: book_library
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: bookuser
      PGPASSWORD: 123456
      PGDATABASE: book_library
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["psql", "-X", "--set=ON_ERROR_STOP=1", "--single-transaction", "--file=/migrations/run.sql"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: book_library
      DB_USER: bookuser
      DB_PASSWORD: 123456
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
